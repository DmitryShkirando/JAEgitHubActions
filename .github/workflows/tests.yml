name: Naming of Job

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Позволяет запускать тесты вручную из вкладки Actions на GitHub
  workflow_dispatch:

jobs:
  testing:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Чекaут репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          # Включаем кэширование npm-пакетов для ускорения запусков
          cache: 'npm'

      - name: Установка зависимостей
        run: npm ci

      - name: Установка браузеров Playwright
        run: npx playwright install --with-deps

      - name: Запуск тестов Playwright
        run: npx playwright test

      # Сохраняем HTML-отчет как артефакт (доступен для скачивания в GitHub после прогона)
      - name: Загрузка HTML-отчета
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
